# GitHub 위에서 도는 검사.
#
# ★ 무엇을 검사할지는 여기에 적지 않는다 — 루트 package.json 의 스크립트와
#   tools/*.ps1 이 정본이고, 이 파일은 그걸 부르기만 한다.
#   ⚠ 검사 내용을 여기에도 적으면 로컬(tools/ci.ps1)과 갈라지고, 둘 중 어느
#     쪽이 진짜인지 아무도 모르게 된다.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 절대 원칙 P1~P7 (docs/SPEC.md §0.1)
        shell: pwsh
        run: ./tools/principles.ps1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 노드 버전의 정본은 .nvmrc 하나다. 여기에 숫자를 적지 마라.
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 루프 문서(docs/STATUS.md)가 자기와 어긋나지 않는가 (FINDINGS 102).
      #  ⚠ 무엇을 재는지는 tools/status-shape.mjs 가 정본이다.
      - run: pnpm docs:check

      - run: pnpm typecheck

      - run: pnpm test

      # 🔴 배포와 같은 빌드 (INBOX H6). 시험이 다 지나도 `next build` 만 깨지는 날이 있었고, 그건 Vercel 이
      #    처음 알려 줬다 — 심사 기간엔 늦다. `.env.local` 없이도 지어진다 (env 는 전부 요청 시점에 읽는다 · 2026-09-10 확인).
      - run: pnpm --filter web build

      # `claude plugin validate` 는 아직 여기서 안 돈다 — 그 CLI 가 러너에 없다.
      #  ★ 대신 `pnpm test` 안의 `plugin/contextops/test/plugin-manifest.test.ts` 가
      #    그 도구가 요구하는 최소 모양(name·version·description)과 **두 곳에 적힌 버전이
      #    같은지**를 잰다. 진짜 판정은 사람이 손으로 돌린 근거로 남긴다:
      #    docs/evidence/2026-09-03-plugin/claude-plugin-validate.txt (2.1.233 · passed)
      #  ⚠ 여기에 `npx @anthropic-ai/claude-code plugin validate` 를 넣지 마라 —
      #    매 push 마다 CLI 를 내려받게 되고, 네트워크가 흔들리면 **우리 잘못이 아닌
      #    빨강**이 난다. 게이트는 우리가 고칠 수 있는 것만 재야 한다.
