# 심사 기간에 production 이 살아 있는지 30분마다 두드린다 (INBOX H6 · docs/DEPLOY.md 「심사 기간」).
#
# ★ 무엇을 재나 — 세 가지뿐이다. 랜딩이 열리나 · health 가 200 이고 DB·AI 에 닿나 · 게스트 세션이 발급되나.
#   셋 중 하나라도 아니면 이 workflow 가 실패하고, GitHub 이 저장소 주인에게 메일을 보낸다 (기본 알림).
# ★ 왜 GitHub Actions 인가 — 돈이 안 들고, 이미 알림이 연결돼 있고, Vercel 밖에서 재므로 Vercel 자체가 죽은 것도 잡는다.
# 🙋 켜는 법 — 저장소 Settings → Secrets and variables → Actions → Variables 에 `PROD_ORIGIN`(예: https://contextops.vercel.app).
#   없으면 조용히 건너뛴다 (아직 배포 전인 fork 에서 빨간 점이 찍히지 않게). 만든 날 **일부러 깨서**(잘못된 origin 을 넣고
#   dispatch) 메일이 오는지 한 번 확인해라 — 확인 안 한 감시는 감시가 아니다.
# ⚠ 너무 잦게 두드리지 않는다 — 30분이면 하루 48회. Hobby 함수 호출 한도의 티끌이고, 리셋(03:00 KST) 뒤 첫 실패를 30분 안에 안다.
name: watch-prod

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: production 이 살아 있나
        env:
          PROD_ORIGIN: ${{ vars.PROD_ORIGIN }}
        run: |
          set -u
          if [ -z "${PROD_ORIGIN:-}" ]; then
            echo "PROD_ORIGIN 변수가 없다 — 배포 전이면 정상이다. 건너뛴다."
            exit 0
          fi
          origin="${PROD_ORIGIN%/}"
          fail=0

          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$origin/")
          echo "GET / → $code"
          [ "$code" = "200" ] || fail=1

          health=$(curl -s --max-time 30 "$origin/api/v1/health" || true)
          echo "GET /api/v1/health → $health"
          echo "$health" | grep -q '"db":true' || { echo "health.db 가 참이 아니다"; fail=1; }
          echo "$health" | grep -q '"ai":true' || { echo "health.ai 가 참이 아니다 — GEMINI_API_KEY 가 빠졌다"; fail=1; }

          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -X POST "$origin/api/v1/demo/session")
          echo "POST /api/v1/demo/session → $code"
          case "$code" in 200|201) ;; *) echo "게스트 세션이 안 나온다 — 데모가 안 심겼거나 리셋이 실패했다"; fail=1 ;; esac

          if [ "$fail" != "0" ]; then
            echo "::error::production 감시 실패 — docs/DEPLOY.md 「심사 기간」 런북을 봐라"
            exit 1
          fi
