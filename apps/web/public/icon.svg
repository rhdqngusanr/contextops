<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ContextOps">
  <!-- ContextOps 아이콘 — 색은 docs/DESIGN_BRIEF.md §3 토큰 값 그대로다: ink #111110 · on-accent #FFFFFF
       같은 그림이 랜딩 머리글의 BrandMark(components/landing.tsx)에도 있다 — 거긴 var(--토큰) 이고 여기는 값이다 (아이콘은 CSS 를 못 읽는다).
       그림 하나: 검정 둥근 사각 안의 확인 표시 — 「사람이 확인한 것만 남는다」. 16px 에서도 읽히게 획이 굵다. -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#111110"/>
  <path d="M19 33.5l8.5 8.5L45 24" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
