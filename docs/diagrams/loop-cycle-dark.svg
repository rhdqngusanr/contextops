<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" width="940" height="360" role="img" aria-label="자율 루프 한 바퀴 — ctl.ps1 이 보이는 터미널 창에서 loop.ps1 을 돌리고, 한 바퀴마다 새 세션이 읽고 하나만 고치고 기록을 남긴다">
  <style>
    .t { font-family:'Pretendard','Noto Sans KR','Malgun Gothic',-apple-system,system-ui,sans-serif; }
    .m { font-family:'JetBrains Mono','Consolas',ui-monospace,monospace; }
    .b { font-size:12.5px; fill:#D5DAE2; }
    .s { font-size:10.5px; fill:#A7AEB9; }
    .n { font-size:13px; font-weight:700; fill:#7B9CFF; }
  </style>
  <rect width="940" height="360" fill="#08090B"/>

  <rect x="16" y="20" width="908" height="46" rx="9" fill="#0A0E1A" stroke="#1B1E24"/>
  <text x="34" y="40" class="m b">loop\ctl.ps1 start</text>
  <text x="34" y="58" class="t s">→ <tspan fill="#5FC48F">보이는 터미널 창</tspan>에서 <tspan class="m" fill="#D5DAE2">loop.ps1</tspan> 이 돈다 · 창이 사라진 것이 멈춘 신호다</text>

  <rect x="16" y="82" width="908" height="46" rx="9" fill="#0A0E1A" stroke="#24304F"/>
  <text x="34" y="102" class="t s">한 바퀴 = <tspan fill="#7B9CFF" font-weight="700">새 헤드리스 세션 하나</tspan> · 대화를 이어 붙이지 않는다</text>
  <text x="34" y="120" class="m b" fill="#7B9CFF">claude -p "Read loop/PROMPT.md and follow it exactly."</text>

  <rect x="16" y="150" width="292" height="130" rx="9" fill="#0C0E12" stroke="#1B1E24"/>
  <text x="34" y="176" class="t n">① 읽는다</text>
  <text x="34" y="200" class="m b">INBOX → FINDINGS</text>
  <text x="34" y="220" class="m b">→ PLAN → STATUS</text>
  <text x="34" y="240" class="m b">→ SPEC 해당 §</text>
  <text x="34" y="264" class="t s">이번 바퀴의 일을 여기서 고른다</text>

  <rect x="324" y="150" width="292" height="130" rx="9" fill="#0C0E12" stroke="#1B1E24"/>
  <text x="342" y="176" class="t n">② 하나만 고친다</text>
  <text x="342" y="200" class="m b">tools/walkthrough.ps1</text>
  <text x="342" y="220" class="t b">→ 막힌 자리 하나</text>
  <text x="342" y="242" class="m b">tools/ci.ps1</text>
  <text x="342" y="264" class="t s">초록이어야 커밋 · push 한다</text>

  <rect x="632" y="150" width="292" height="130" rx="9" fill="#0C0E12" stroke="#2C5C43"/>
  <text x="650" y="176" class="t n" fill="#5FC48F">③ 남긴다</text>
  <text x="650" y="200" class="m b">docs/STATUS.md</text>
  <text x="650" y="220" class="m b">docs/feedback/FINDINGS.md</text>
  <text x="650" y="246" class="t s" fill="#5FC48F">다음 바퀴의 유일한 기억</text>
  <text x="650" y="264" class="t s">기억은 대화가 아니라 파일에 산다</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#A7AEB9"/></marker>
  </defs>
  <line x1="308" y1="215" x2="318" y2="215" stroke="#A7AEB9" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="616" y1="215" x2="626" y2="215" stroke="#A7AEB9" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M778,284 L778,312 L162,312 L162,288" fill="none" stroke="#3A404A" stroke-width="1.6"
        stroke-dasharray="4 4" marker-end="url(#a)"/>
  <text x="470" y="332" class="t s" text-anchor="middle">다음 바퀴는 이 기록만 읽고 새로 시작한다 — 앞 대화를 모른다</text>
</svg>
